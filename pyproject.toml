[project]
name = "SubUnicode"
dynamic = ["version"]
description = "Unlimited subspaces in Unicode private use areas!"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
dependencies = []

[project.urls]
Homepage = "https://github.com/UTF-8000/SubUnicode-Python/"

[project.scripts]
subunicode = "SubUnicode.CLI:main"

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.dynamic]
version = {attr = "SubUnicode.__version__"}

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
